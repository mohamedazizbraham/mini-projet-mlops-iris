name: iris-mlops-mini
x-common: &common
  image: iris-mlops-mini:local
  build: .
  working_dir: /app
  volumes:
    - .:/app
  environment: &env
    MLFLOW_TRACKING_URI: http://mlflow:5000
    ZENML_CONFIG_PATH: /app/runtime/zenml
    ZENML_ANALYTICS_OPT_IN: 'false'
    ZENML_ENABLE_RICH_TRACEBACK: 'false'
    OPENBLAS_NUM_THREADS: '1'
    OMP_NUM_THREADS: '1'
    MKL_NUM_THREADS: '1'
    DVC_NO_ANALYTICS: 'true'
services:
  mlflow:
    <<: *common
    command: mlflow server --host 0.0.0.0 --port 5000 --workers 1 --backend-store-uri sqlite:////app/runtime/mlflow.db --serve-artifacts --artifacts-destination /app/runtime/mlartifacts
    ports: ['127.0.0.1:5500:5000']
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:5000/health")']
      interval: 5s
      timeout: 3s
      retries: 20
  trainer:
    <<: *common
    profiles: [tools]
    command: python -m src.train
    depends_on:
      mlflow:
        condition: service_healthy
  zenml:
    <<: *common
    profiles: [tools]
    environment:
      <<: *env
      ZENML_CONFIG_PATH: /app/runtime/zenml-ui
      ZENML_STORE_URL: sqlite:////app/runtime/zenml/local_stores/default_zen_store/zenml.db
    command: sh -c 'mkdir -p /app/runtime/zenml-ui && cp /app/runtime/zenml/config.yaml /app/runtime/zenml-ui/config.yaml && zenml up --blocking --ip-address 0.0.0.0 --port 8080'
    ports: ['127.0.0.1:8501:8080']
  api:
    <<: *common
    environment:
      <<: *env
      MODEL_VERSION: ${MODEL_VERSION:-v1}
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports: ['127.0.0.1:8500:8000']
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 3s
      timeout: 2s
      retries: 20
